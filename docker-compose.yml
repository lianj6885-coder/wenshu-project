# 文枢 · 全栈编排（MongoDB + Redis + Python 后端 + pi 智能体服务 + Next.js 前端）
# 用法：docker compose up --build
name: wenshu

services:
  mongodb:
    image: mongo:7.0
    container_name: wenshu-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-wenshu}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-wenshu}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_INITDB_ROOT_USERNAME:-wenshu}", "-p", "${MONGO_INITDB_ROOT_PASSWORD:-wenshu}", "--authenticationDatabase", "admin", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wenshu-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-wenshu}
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: wenshu-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-wenshu}:${MONGO_INITDB_ROOT_PASSWORD:-wenshu}@mongodb:27017/${MONGODB_DB:-wenshu}?authSource=admin
      REDIS_ADDR: redis://:${REDIS_PASSWORD:-wenshu}@redis:6379
      PI_AGENT_URL: http://pi-agent:8100
      PI_AGENT_ENABLED: "true"
      VECTOR_BACKEND: mongo
      HOST: 0.0.0.0
      PORT: 8000
      UPLOAD_STORAGE_DIR: /data/uploads
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./department_files:/app/department_files:ro
      - upload_data:/data/uploads

  worker:
    build:
      context: ./backend
    container_name: wenshu-worker
    restart: unless-stopped
    command: ["python", "-m", "scripts.async_worker"]
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-wenshu}:${MONGO_INITDB_ROOT_PASSWORD:-wenshu}@mongodb:27017/${MONGODB_DB:-wenshu}?authSource=admin
      REDIS_ADDR: redis://:${REDIS_PASSWORD:-wenshu}@redis:6379
      STORAGE_MODE: mongo
      VECTOR_BACKEND: mongo
      UPLOAD_STORAGE_DIR: /data/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/data/uploads

  pi-agent:
    build:
      context: ./services/pi-agent
    container_name: wenshu-pi-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8100
      HOST: 0.0.0.0
      BACKEND_URL: http://backend:8000
    ports:
      - "8100:8100"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      args:
        BACKEND_URL: http://backend:8000
    container_name: wenshu-web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      PORT: 3000
    ports:
      - "8080:3000"
    depends_on:
      - backend

volumes:
  mongodb_data:
  redis_data:
  upload_data:
